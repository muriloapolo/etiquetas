<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sistema Profissional de Etiquetas</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="./css/style.css"/>
</head>
<body class="bg-light">

    <!-- MENU -->
    <header class="navbar navbar-dark bg-dark shadow-sm mb-4" id="mainHeader">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1">📦 Gerenciador de Etiquetas</span>
        </div>
    </header>

    <!-- FORMULÁRIO PRINCIPAL -->
    <div class="container mb-5" id="mainContainer">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-4 p-4 bg-white">
                    <h2 class="text-center text-primary mb-4 fw-bold">Emissão de Etiquetas de Expedição</h2>
                    <form id="formEtiquetas">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nome do Cliente</label>
                            <input class="form-control" type="text" id="nomeCliente" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Chave de Acesso da NF (44 dígitos)</label>
                            <input class="form-control" type="text" id="chaveAcesso" maxlength="60" required/>
                        </div>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-semibold">Cidade de Destino</label>
                                <input class="form-control" type="text" id="nomeCidade" required/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Estado (UF)</label>
                                <select class="form-select" id="estado" required>
                                    <option value="" disabled selected>UF...</option>
                                    <option value="SP">SP</option><option value="RJ">RJ</option><option value="MG">MG</option>
                                    <option value="BA">BA</option><option value="PR">PR</option><option value="SC">SC</option>
                                    <!-- Adicione as demais UFs conforme necessidade -->
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Volumes</label>
                                <input class="form-control" type="number" min="1" id="volumes" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Nota Fiscal</label>
                                <input class="form-control" type="text" id="notaFiscal" required/>
                            </div>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="button" class="btn btn-primary btn-lg shadow-sm" id="geraEtiquetaBtn">
                                🚀 Visualizar Prévia das Etiquetas
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFERÊNCIA -->
    <div class="modal fade" id="confirmEtiquetas" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-dark text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">🔍 Conferência de Dados</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <ul class="list-group list-group-flush fs-5">
                        <li class="list-group-item"><strong>Cliente:</strong> <span id="cliModal"></span></li>
                        <li class="list-group-item"><strong>Destino:</strong> <span id="city"></span> - <span id="uf"></span></li>
                        <li class="list-group-item"><strong>Nota Fiscal:</strong> <span id="nf"></span></li>
                        <li class="list-group-item"><strong>Volumes:</strong> <span id="vol"></span></li>
                    </ul>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Corrigir</button>
                    <button type="button" class="btn btn-success px-4" id="btnConfirmaEtiqueta">Confirmar e Gerar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ÁREA DE IMPRESSÃO -->
    <div class="book" id="printArea" style="display: none;"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="./js/index.js"></script>
</body>
</html>
